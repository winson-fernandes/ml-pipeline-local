version: '3.8'

services:
  # This service requires a trained and deployed model in
  # ../models/registry/latest/, so run `make pipeline` at the repo root first.
  model-server:
    build:
      context: ..
      dockerfile: Dockerfile.serve
    container_name: heart-disease-model-server
    ports:
      - "8080:8080"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: frontend-app/Dockerfile.api
    container_name: heart-disease-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_SERVER_URL=http://model-server:8080
    depends_on:
      - model-server
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: heart-disease-web
    ports:
      - "5000:5000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: heart-disease-network
